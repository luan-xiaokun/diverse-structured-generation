name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: regex_dfa_guide

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Build Rust extension
        run: uv run maturin develop --release -m regex_dfa_guide/Cargo.toml

      - name: Run tests with coverage
        run: uv run poe test

      - name: Run Rust tests
        run: uv run poe test-rust

      - name: Lint
        run: uv run poe lint

  powershell:
    name: PowerShell experiment scripts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem -Path experiments -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parse failed for $($_.FullName)"
            }
          }

      - name: Check PowerShell seed helpers
        shell: pwsh
        env:
          SEED: "42"
        run: |
          $ErrorActionPreference = "Stop"
          . ./experiments/common.ps1

          $seedArgs = Get-SeedArgs
          if (($seedArgs -join " ") -ne "--seed 42") {
            throw "Expected '--seed 42', got '$($seedArgs -join " ")'"
          }

          $extraArgs = Get-GrammarExtraArgs -Grammar json
          if (($extraArgs -join " ") -ne "--max-tokens 54") {
            throw "Unexpected json grammar args: '$($extraArgs -join " ")'"
          }

          $metricPath = Get-MetricResultPath `
            -Experiment temperature_ablation `
            -Grammar css-color `
            -ResultSuffix temperature-1.5
          if ($metricPath -ne "results/temperature_ablation/diverse/temperature-1.5/css-color.json") {
            throw "Unexpected metric path: '$metricPath'"
          }

          $baselineMetricPath = Get-MetricResultPath `
            -Experiment diversity `
            -Baseline `
            -Grammar email
          if ($baselineMetricPath -ne "results/diversity/baseline/email.json") {
            throw "Unexpected baseline metric path: '$baselineMetricPath'"
          }

          $runtimePath = Get-RuntimeResultPath `
            -Baseline `
            -Grammar ipv4
          if ($runtimePath -ne "results/runtime/baseline/ipv4.json") {
            throw "Unexpected runtime path: '$runtimePath'"
          }
