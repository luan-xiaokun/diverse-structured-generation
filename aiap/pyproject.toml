[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiap-baseline"
version = "0.1.0"
description = "AIAP baseline witness generation package"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["aiap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_case_parity: requires provisioned locked Hugging Face tokenizer"]
