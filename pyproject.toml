[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diverse-guide"
version = "0.2.0"
description = "Diversity-enhancing method for LLM structured generation with regex constraints"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Xiaokun Luan" },
  { name = "Zeming Wei" },
  { name = "Yihao Zhang" },
  { name = "Meng Sun" },
]
keywords = [
  "automata",
  "diversity",
  "large-language-models",
  "regular-expressions",
  "structured-generation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "regex-dfa-guide",
  "numpy>=2.2.3",
  "scipy>=1.15.2",
  "torch==2.8.0",
  "tqdm>=4.67.1",
  "transformers>=5.3.0",
]

[project.urls]
Homepage = "https://github.com/luan-xiaokun/diverse-structured-generation"
Repository = "https://github.com/luan-xiaokun/diverse-structured-generation"
Issues = "https://github.com/luan-xiaokun/diverse-structured-generation/issues"
Paper = "https://doi.org/10.1007/978-981-95-4213-0_2"

[dependency-groups]
dev = [
  "maturin>=1.7,<2.0",
  "poethepoet>=0.33.1",
  "pytest>=9.0.2",
  "pytest-cov>=7.1.0",
  "ruff>=0.9.10",
]
outlines = [
  "outlines[transformers]==1.2.12",
]

[tool.poe]
executor = "uv"

[tool.poe.env]
PYTHONPATH = "src"

[tool.poe.tasks.gen]
cmd = "python scripts/generate_re.py"
help = "Generate regex data"

[tool.poe.tasks.eval]
cmd = "python scripts/metrics_eval.py"
help = "Run metric evaluation"

[tool.poe.tasks.eval-runtime]
cmd = "python scripts/eval_runtime.py"
env = { PYTHONPATH = "src:scripts" }
help = "Run runtime evaluation"

[tool.poe.tasks.format]
cmd = "ruff format src tests examples scripts"
help = "Format code with Ruff"

[tool.poe.tasks.lint]
cmd = "ruff check src tests examples scripts regex_dfa_guide/python"
help = "Run Ruff checks"

[tool.poe.tasks.lint-fix]
cmd = "ruff check src tests examples scripts regex_dfa_guide/python --fix"
help = "Run Ruff checks and apply safe fixes"

[tool.poe.tasks.test]
cmd = "pytest"
help = "Run test suite"

[tool.poe.tasks.test-rust]
cmd = "cargo test --manifest-path regex_dfa_guide/Cargo.toml"
help = "Run Rust tests for regex_dfa_guide"

[tool.poe.tasks.cov-rust]
cmd = "cargo llvm-cov --manifest-path regex_dfa_guide/Cargo.toml --summary-only"
help = "Run Rust coverage for regex_dfa_guide (requires cargo-llvm-cov)"

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = [
  "--cov=diverse_guide",
  "--cov-report=term-missing",
  "--cov-branch",
  "-ra",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "I"]

[tool.ruff.format]
docstring-code-format = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.workspace]
exclude = ["experiments/case_study"]

[tool.uv.sources]
regex-dfa-guide = { path = "regex_dfa_guide" }
